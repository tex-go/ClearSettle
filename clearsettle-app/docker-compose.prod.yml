x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"
  # NOTE: Logs are structured JSON — view with:
  #   docker logs -f clearsettle-backend-prod | python3 -c "
  #   import sys,json
  #   for l in sys.stdin:
  #     try: d=json.loads(l); print(d.get('severity','?')[:4],'|',d.get('message','')[:140])
  #     except: print(l,end='')"
  #
  # To enable GCP Cloud Logging driver on the VM, run once:
  #   gcloud projects add-iam-policy-binding clearsettle-prod \
  #     --member="serviceAccount:$(gcloud compute instances describe clearsettle-backend \
  #       --format='value(serviceAccounts[0].email)')" \
  #     --role="roles/logging.logWriter"
  # Then change driver to gcplogs and add: gcp-project: "clearsettle-prod"

x-restart: &always-restart
  restart: unless-stopped

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true    # DB network is not routable externally

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  redis_data:
  certbot_certs:
  certbot_www:
  nginx_logs:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: clearsettle-postgres-prod
    <<: *always-restart
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-clearsettle}
      POSTGRES_USER:     ${POSTGRES_USER:-clearsettle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearsettle_user} -d ${POSTGRES_DB:-clearsettle}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ── Redis (sessions + rate limiting + task queue) ──────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: clearsettle-redis-prod
    <<: *always-restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: clearsettle-backend-prod
    <<: *always-restart
    environment:
      ENV:                production
      DATABASE_URL:       postgresql+asyncpg://${POSTGRES_USER:-clearsettle_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clearsettle}
      SECRET_KEY:         ${SECRET_KEY}
      ENCRYPTION_KEY:     ${ENCRYPTION_KEY}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      SP_API_CLIENT_ID:   ${SP_API_CLIENT_ID:-}
      SP_API_CLIENT_SECRET: ${SP_API_CLIENT_SECRET:-}
      SP_API_REFRESH_TOKEN: ${SP_API_REFRESH_TOKEN:-}
      SP_API_ENDPOINT:    ${SP_API_ENDPOINT:-https://sellingpartnerapi-eu.amazon.com}
      SP_API_REDIRECT_URI: ${SP_API_REDIRECT_URI:-https://clearsettle.in/marketplace/oauth/callback}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL:       ${FRONTEND_URL:-https://clearsettle.in}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-https://clearsettle.in}
      SUPER_ADMIN_EMAIL:  ${SUPER_ADMIN_EMAIL:-Admin@clearsettle.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      GCS_UPLOADS_BUCKET:    ${GCS_UPLOADS_BUCKET:-}
      UPLOAD_DIR:            /app/uploads/ingestion
      GOOGLE_CLIENT_ID:      ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:  ${GOOGLE_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID:      ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET:  ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-clearsettle://oauth/instagram/callback}
      PORT:                  8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - db_net
    expose:
      - "8000"
    volumes:
      - /opt/clearsettle/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging: *default-logging

  # ── React Frontend (nginx:alpine) ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: clearsettle-frontend-prod
    <<: *always-restart
    environment:
      PORT:    3000
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend_net
      - backend_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ── NGINX Reverse Proxy + SSL Termination ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: clearsettle-nginx-prod
    <<: *always-restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /opt/clearsettle/certbot/certs:/etc/letsencrypt:ro
      - /opt/clearsettle/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── Certbot (Let's Encrypt auto-renewal every 12h) ───────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: clearsettle-certbot
    <<: *always-restart
    volumes:
      - /opt/clearsettle/certbot/certs:/etc/letsencrypt
      - /opt/clearsettle/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'
    logging: *default-logging
