x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

x-restart: &always-restart
  restart: unless-stopped

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true    # DB network is not routable externally

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  certbot_certs:
  certbot_www:
  nginx_logs:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Redis (sessions + rate limiting + task queue) ──────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: clearsettle-redis-prod
    <<: *always-restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY}/clearsettle-backend:${IMAGE_TAG}
    container_name: clearsettle-backend-prod
    <<: *always-restart
    environment:
      ENV:                production
      DATABASE_URL:       ${DATABASE_URL}
      SECRET_KEY:         ${SECRET_KEY}
      ENCRYPTION_KEY:     ${ENCRYPTION_KEY}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      SP_API_CLIENT_ID:   ${SP_API_CLIENT_ID}
      SP_API_CLIENT_SECRET: ${SP_API_CLIENT_SECRET}
      SP_API_REFRESH_TOKEN: ${SP_API_REFRESH_TOKEN:-}
      SP_API_ENDPOINT:    ${SP_API_ENDPOINT}
      SP_API_REDIRECT_URI: ${SP_API_REDIRECT_URI}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      FRONTEND_URL:       ${FRONTEND_URL}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS}
      GCS_UPLOADS_BUCKET: ${GCS_UPLOADS_BUCKET:-}
      PORT:               8000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
    expose:
      - "8000"
    volumes:
      - /opt/clearsettle/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging: *default-logging

  # ── React Frontend (nginx:alpine) ──────────────────────────────────────────
  frontend:
    image: ${REGISTRY}/clearsettle-frontend:${IMAGE_TAG}
    container_name: clearsettle-frontend-prod
    <<: *always-restart
    environment:
      PORT:    3000
      API_URL: http://backend:8000
    networks:
      - frontend_net
      - backend_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── NGINX Reverse Proxy + SSL Termination ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: clearsettle-nginx-prod
    <<: *always-restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Host paths match ssl-init.sh output — override named volumes
      - /opt/clearsettle/certbot/certs:/etc/letsencrypt:ro
      - /opt/clearsettle/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── Certbot (Let's Encrypt auto-renewal every 12h) ───────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: clearsettle-certbot
    <<: *always-restart
    volumes:
      - /opt/clearsettle/certbot/certs:/etc/letsencrypt
      - /opt/clearsettle/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'
    logging: *default-logging
