name: clearsettle_mobile
description: ClearSettle — eCommerce Settlement Intelligence for Indian Sellers
publish_to: 'none'
version: 1.5.1+37

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.0.0

  # File Handling
  file_picker: ^8.0.0
  excel: ^4.0.3
  path_provider: ^2.1.3

  # Secure Token Storage
  flutter_secure_storage: ^9.2.2

  # HTTP Client
  dio: ^5.4.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.70.0

  # Export
  pdf: ^3.11.0
  printing: ^5.13.2
  share_plus: ^10.0.2

  # OAuth — browser-based OAuth 2.0 with Chrome Custom Tabs
  flutter_web_auth_2: ^4.0.0

  # Firebase — FCM push notifications + App Distribution
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/clear_settle_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/clear_settle_logo.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
