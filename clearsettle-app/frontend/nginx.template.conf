server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Resolver is injected at startup via NGINX_RESOLVER env var.
    # Local Docker: 127.0.0.11 (Docker embedded DNS — resolves container names).
    # Railway / cloud: 8.8.8.8 (public DNS — resolves public hostnames).
    # valid=5s: short TTL so stale entries don't linger.
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # React Router — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backend (deferred DNS via $backend variable)
    location /api/ {
        set $backend "${API_URL}";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
