[pytest]
asyncio_mode = auto
asyncio_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-config=.coveragerc
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
