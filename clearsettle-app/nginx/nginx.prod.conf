user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main  buffer=32k  flush=5s;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Limits ────────────────────────────────────────────────────────────────
    client_max_body_size  50M;    # Flipkart Excel reports can be large
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          30s;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m        rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m       rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=upload:10m     rate=5r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend_app {
        server backend:8000;
        keepalive 16;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect + ACME challenge ────────────────────────────────
    server {
        listen       80;
        server_name  _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── www → apex redirect ───────────────────────────────────────────────────
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  www.clearsettle.in;

        ssl_certificate     /etc/letsencrypt/live/clearsettle.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clearsettle.in/privkey.pem;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;

        return 301 https://clearsettle.in$request_uri;
    }

    # ── HTTPS Main Server ─────────────────────────────────────────────────────
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  clearsettle.in;

        # ── SSL ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/clearsettle.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/clearsettle.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/clearsettle.in/chain.pem;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;
        ssl_session_tickets        off;
        ssl_stapling               on;
        ssl_stapling_verify        on;
        resolver                   8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout           5s;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header X-XSS-Protection           "1; mode=block"                                always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

        limit_conn perip 20;

        # ── API Proxy ─────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass          http://backend_app;
            proxy_http_version  1.1;
            proxy_set_header    Host              $http_host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Authorization     $http_authorization;
            proxy_set_header    Connection        "";
            proxy_read_timeout  30s;
        }

        location /api/flipkart/upload {
            limit_req zone=upload burst=3 nodelay;
            limit_req_status 429;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass            http://backend_app;
            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_set_header      Authorization     $http_authorization;
            proxy_set_header      Connection        "";
            client_max_body_size  100M;
            proxy_read_timeout    120s;    # Large Excel files take time
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass          http://backend_app;
            proxy_http_version  1.1;
            proxy_set_header    Host              $http_host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Authorization     $http_authorization;
            proxy_set_header    Connection        "";
            proxy_read_timeout  60s;
        }

        # ── Static assets (long-lived cache) ──────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://frontend_app;
            proxy_set_header   Host $http_host;
            expires            1y;
            add_header         Cache-Control "public, immutable";
            access_log         off;
        }

        # ── SPA Frontend ──────────────────────────────────────────────────────
        location / {
            proxy_pass          http://frontend_app;
            proxy_http_version  1.1;
            proxy_set_header    Host              $http_host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";
            proxy_read_timeout  30s;

            # SPA fallback — let React Router handle deep links
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # ── Health check endpoint (no auth, no rate limit) ────────────────────
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
