# Bootstrap-only Nginx config.
# Used ONCE during first-time SSL certificate issuance.
# After certs are obtained, switch to nginx.prod.conf.

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    server {
        listen 80;
        server_name clearsettle.in www.clearsettle.in;

        # ACME challenge — Certbot writes files here to prove domain ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Everything else: temporary holding page (cert not ready yet)
        location / {
            return 200 "ClearSettle — SSL setup in progress. Please check back shortly.\n";
            add_header Content-Type text/plain;
        }
    }
}
