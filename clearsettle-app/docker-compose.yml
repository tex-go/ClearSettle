version: "3.9"
services:
  backend:
    build: ./backend
    container_name: clearsettle-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=clearsettle-secret-key-2026
      - ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: clearsettle-frontend
    ports:
      - "80:80"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
