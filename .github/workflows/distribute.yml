name: Android — Build & Distribute

on:
  # Fires after auto-version pushes the vX.Y.Z tag — APK has the correct version baked in.
  # This avoids the race condition where the distribute job runs before the version bump.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # Manual trigger for hotfixes / on-demand distribution
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Manual build'

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    name: Build signed APK → Firebase App Distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the commit the tag points to (not detached HEAD issues)
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # Decode release keystore from GitHub secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > clearsettle-app/mobile/android/app/clearsettle-release.jks

      # Write key.properties so Gradle signing config can read it
      - name: Write key.properties
        run: |
          cat > clearsettle-app/mobile/android/key.properties << 'EOF'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/clearsettle-release.jks
          EOF

      - name: Flutter pub get
        working-directory: clearsettle-app/mobile
        run: flutter pub get

      - name: Build signed release APK
        working-directory: clearsettle-app/mobile
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --dart-define=INSTAGRAM_APP_ID=${{ secrets.INSTAGRAM_APP_ID }}

      # Upload APK via Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || github.ref_name }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/svc.json
          printf '%s' "$RELEASE_NOTES" > /tmp/release-notes.txt
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/svc.json \
          firebase appdistribution:distribute \
            clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "clear_settle_testers" \
            --release-notes-file /tmp/release-notes.txt \
            --project clearsettle-mobile
          rm -f /tmp/svc.json /tmp/release-notes.txt

      # Save APK as downloadable workflow artifact (30 days)
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearsettle-${{ github.ref_name }}-${{ github.sha }}
          path: clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
