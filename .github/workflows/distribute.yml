name: Android — Build & Distribute

on:
  push:
    branches: [main]
    paths:
      - 'clearsettle-app/mobile/**'
      - '.github/workflows/distribute.yml'

  workflow_dispatch:   # allow manual trigger from GitHub UI

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build signed APK → Firebase App Distribution
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Flutter ────────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # ── Java 17 (Gradle needs it) ──────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Restore release keystore from secret ───────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > clearsettle-app/mobile/android/app/clearsettle-release.jks

      # ── Write key.properties (never committed) ─────────────────────────────
      - name: Write key.properties
        run: |
          cat > clearsettle-app/mobile/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/clearsettle-release.jks
          EOF

      # ── Write Firebase service-account JSON ────────────────────────────────
      - name: Write Firebase service account
        run: |
          mkdir -p /tmp/clearsettle
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' \
            > /tmp/clearsettle/firebase-service-account.json
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=/tmp/clearsettle/firebase-service-account.json" \
            >> $GITHUB_ENV

      # ── Install packages ───────────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: clearsettle-app/mobile
        run: flutter pub get

      # ── Build signed release APK ───────────────────────────────────────────
      - name: Build release APK
        working-directory: clearsettle-app/mobile
        run: flutter build apk --release

      # ── Upload to Firebase App Distribution ────────────────────────────────
      - name: Upload to Firebase App Distribution
        working-directory: clearsettle-app/mobile/android
        run: ./gradlew appDistributionUploadRelease

      # ── Save APK as workflow artifact ──────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearsettle-release-${{ github.sha }}
          path: clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
