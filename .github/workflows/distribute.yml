name: Android — Build & Distribute

on:
  push:
    branches: [main]
    paths:
      - 'clearsettle-app/mobile/lib/**'
      - 'clearsettle-app/mobile/android/**'
      - 'clearsettle-app/mobile/pubspec.yaml'
      - '.github/workflows/distribute.yml'

  workflow_dispatch:

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false  # never cancel — auto-version bot would kill real builds

jobs:
  distribute:
    name: Build signed APK → Firebase App Distribution
    runs-on: ubuntu-latest
    # Skip version-bump-only commits from the auto-version bot
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # Decode release keystore from GitHub secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > clearsettle-app/mobile/android/app/clearsettle-release.jks

      # Write key.properties so Gradle signing config can read it
      - name: Write key.properties
        run: |
          cat > clearsettle-app/mobile/android/key.properties << 'EOF'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/clearsettle-release.jks
          EOF

      - name: Flutter pub get
        working-directory: clearsettle-app/mobile
        run: flutter pub get

      - name: Build signed release APK
        working-directory: clearsettle-app/mobile
        run: flutter build apk --release

      # Upload APK via Firebase CLI (official, no tester-group required)
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/svc.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/svc.json \
          firebase appdistribution:distribute \
            clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "clear_settle_testers" \
            --release-notes "${{ github.event.head_commit.message }}" \
            --project clearsettle-mobile
          rm -f /tmp/svc.json

      # Save APK as downloadable workflow artifact (30 days)
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearsettle-release-${{ github.sha }}
          path: clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
