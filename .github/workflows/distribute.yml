name: Android — Build & Distribute

on:
  push:
    branches: [main]
    paths:
      - 'clearsettle-app/mobile/lib/**'
      - 'clearsettle-app/mobile/android/**'
      - 'clearsettle-app/mobile/pubspec.yaml'
      - '.github/workflows/distribute.yml'

  workflow_dispatch:

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false  # never cancel — auto-version bot would kill real builds

jobs:
  distribute:
    name: Build signed APK → Firebase App Distribution
    runs-on: ubuntu-latest
    # Skip version-bump-only commits from the auto-version bot
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # Decode release keystore from GitHub secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > clearsettle-app/mobile/android/app/clearsettle-release.jks

      # Write key.properties so Gradle signing config can read it
      - name: Write key.properties
        run: |
          cat > clearsettle-app/mobile/android/key.properties << 'EOF'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/clearsettle-release.jks
          EOF

      - name: Flutter pub get
        working-directory: clearsettle-app/mobile
        run: flutter pub get

      - name: Build signed release APK
        working-directory: clearsettle-app/mobile
        run: flutter build apk --release

      # Upload APK directly to Firebase App Distribution (no Gradle wrapper needed)
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.head_commit.message }}
            Commit: ${{ github.sha }}

      # Save APK as downloadable workflow artifact (30 days)
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearsettle-release-${{ github.sha }}
          path: clearsettle-app/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
