name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false    # never cancel an in-progress prod deploy

env:
  REGISTRY: ${{ secrets.GCP_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. Build & push Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for Workload Identity Federation

    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity — no key files)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION || 'asia-south1' }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./clearsettle-app/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/clearsettle-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/clearsettle-backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/clearsettle-backend:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/clearsettle-backend:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./clearsettle-app/frontend
          push: true
          build-args: |
            VITE_API_URL=https://${{ secrets.PROD_DOMAIN }}/api
          tags: |
            ${{ env.REGISTRY }}/clearsettle-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/clearsettle-frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/clearsettle-frontend:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/clearsettle-frontend:buildcache,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./clearsettle-app/nginx
          file: ./clearsettle-app/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/clearsettle-nginx:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/clearsettle-nginx:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/clearsettle-nginx:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/clearsettle-nginx:buildcache,mode=max

  # ── 2. Deploy to prod VM ───────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA_EMAIL }}

      - name: Copy production docker-compose to VM
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.GCP_VM_NAME }}
          zone:          ${{ secrets.GCP_VM_ZONE }}
          ssh_private_key: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
          command: |
            mkdir -p /opt/clearsettle

      - name: Upload docker-compose.prod.yml
        run: |
          gcloud compute scp \
            clearsettle-app/docker-compose.prod.yml \
            clearsettle-app/nginx/nginx.prod.conf \
            ${{ secrets.GCP_VM_NAME }}:/opt/clearsettle/ \
            --zone=${{ secrets.GCP_VM_ZONE }} \
            --tunnel-through-iap

      - name: Deploy (pull + rolling restart)
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.GCP_VM_NAME }}
          zone:          ${{ secrets.GCP_VM_ZONE }}
          ssh_private_key: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
          command: |
            set -euo pipefail
            cd /opt/clearsettle

            echo "=== Deploy ${{ env.IMAGE_TAG }} [$(date -u)] ==="

            # Authenticate Docker on the VM
            gcloud auth configure-docker ${{ secrets.GCP_REGION || 'asia-south1' }}-docker.pkg.dev --quiet

            # Update IMAGE_TAG in env file
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ env.IMAGE_TAG }}|" .env.prod

            # Pull new images first (while old containers still serve traffic)
            REGISTRY=${{ env.REGISTRY }} IMAGE_TAG=${{ env.IMAGE_TAG }} \
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            # Restart backend first (stateful — DB migrations run here)
            REGISTRY=${{ env.REGISTRY }} IMAGE_TAG=${{ env.IMAGE_TAG }} \
              docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps backend

            # Wait for backend health check
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
                clearsettle-backend-prod 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: Backend did not become healthy in 60s"
                docker logs --tail=50 clearsettle-backend-prod
                exit 1
              fi
              sleep 2
            done

            # Restart remaining services
            REGISTRY=${{ env.REGISTRY }} IMAGE_TAG=${{ env.IMAGE_TAG }} \
              docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps frontend nginx

            # Clean up old images (keep last 5 per repo)
            docker image prune -f --filter "until=168h"

            echo "=== Deploy complete: ${{ env.IMAGE_TAG }} ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps

      - name: Verify deployment
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: ${{ secrets.GCP_VM_NAME }}
          zone:          ${{ secrets.GCP_VM_ZONE }}
          ssh_private_key: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
          command: |
            for i in $(seq 1 10); do
              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                https://${{ secrets.PROD_DOMAIN }}/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Health check passed: $HTTP_STATUS"
                exit 0
              fi
              echo "Attempt $i: status=$HTTP_STATUS — retrying..."
              sleep 5
            done
            echo "ERROR: Health check failed after 50s"
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment of ${{ env.IMAGE_TAG }} FAILED"
          echo "Run: ./infra/scripts/rollback.sh prod to revert"
