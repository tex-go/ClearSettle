name: CI — Test & Coverage

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       clearsettle_test
          POSTGRES_USER:     clearsettle
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:   postgresql+asyncpg://clearsettle:testpass@localhost:5432/clearsettle_test
      SECRET_KEY:     ci-test-secret-key-not-for-production-use-only
      ENCRYPTION_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clearsettle-app/backend/requirements.txt

      - name: Install dependencies
        working-directory: clearsettle-app/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Alembic migrations
        working-directory: clearsettle-app/backend
        run: alembic upgrade head

      - name: Run tests
        id: pytest
        working-directory: clearsettle-app/backend
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-config=.coveragerc \
            --junitxml=test-results.xml
        # continue-on-error so coverage summary still posts even if a test fails
        continue-on-error: true

      - name: Coverage summary → GitHub Step Summary
        working-directory: clearsettle-app/backend
        if: always()
        run: |
          pip install coverage[toml] --quiet
          echo "## Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m coverage report --rcfile=.coveragerc 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Test result badge line
        working-directory: clearsettle-app/backend
        if: always()
        run: |
          TOTAL=$(python -m coverage report --rcfile=.coveragerc 2>/dev/null | tail -1 | awk '{print $NF}' || echo "N/A")
          TESTS_PASSED=$(grep -oP 'passed="\K[0-9]+' test-results.xml 2>/dev/null || echo "?")
          TESTS_FAILED=$(grep -oP 'failures="\K[0-9]+' test-results.xml 2>/dev/null || echo "?")
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests passed | $TESTS_PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests failed | $TESTS_FAILED |" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            clearsettle-app/backend/coverage.xml
            clearsettle-app/backend/coverage.json
            clearsettle-app/backend/test-results.xml

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clearsettle-app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: clearsettle-app/frontend
        run: npm ci

      - name: Run tests with coverage
        id: vitest
        working-directory: clearsettle-app/frontend
        run: npm run test:coverage
        continue-on-error: true

      - name: Coverage summary → GitHub Step Summary
        working-directory: clearsettle-app/frontend
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (x) => x.pct + '% (' + x.covered + '/' + x.total + ')';
              console.log('| Module | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(s.statements) + ' |');
              console.log('| Branches   | ' + fmt(s.branches)   + ' |');
              console.log('| Functions  | ' + fmt(s.functions)  + ' |');
              console.log('| Lines      | ' + fmt(s.lines)      + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail job if tests failed
        if: steps.vitest.outcome == 'failure'
        run: exit 1

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: clearsettle-app/frontend/coverage/

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: frontend-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clearsettle-app/frontend/package-lock.json

      - name: Install & build
        working-directory: clearsettle-app/frontend
        env:
          VITE_API_URL: https://app.clearsettle.in/api
        run: |
          npm ci
          npm run build
