name: CI — Test & Lint

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       clearsettle_test
          POSTGRES_USER:     clearsettle
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://clearsettle:testpass@localhost:5432/clearsettle_test
      SECRET_KEY:   ci-test-secret-key-not-for-production-use-only
      ENCRYPTION_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clearsettle-app/backend/requirements.txt

      - name: Install dependencies
        working-directory: clearsettle-app/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Alembic migrations
        working-directory: clearsettle-app/backend
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: clearsettle-app/backend
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: clearsettle-app/backend/coverage.xml

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clearsettle-app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: clearsettle-app/frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: clearsettle-app/frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: clearsettle-app/frontend/coverage/

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: frontend-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clearsettle-app/frontend/package-lock.json

      - name: Install & build
        working-directory: clearsettle-app/frontend
        env:
          VITE_API_URL: https://app.clearsettle.in/api
        run: |
          npm ci
          npm run build
