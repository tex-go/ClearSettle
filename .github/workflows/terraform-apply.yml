name: Terraform Apply

on:
  push:
    paths:
      - "infra/terraform/**"
    branches:
      - main  # deploys prod
      - dev   # deploys dev

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.8.5"
  WORKING_DIR: infra/terraform/environments

jobs:
  apply:
    name: "Apply — ${{ matrix.env }}"
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}

    strategy:
      fail-fast: false
      matrix:
        env:
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC — no key file)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan

      - name: Capture Outputs
        id: outputs
        run: |
          echo "api_url=$(terraform output -raw api_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "db_connection=$(terraform output -raw db_connection_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Terraform Apply — ${{ matrix.env }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.outputs.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Connection | ${{ steps.outputs.outputs.db_connection }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
