name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.5"
  WORKING_DIR: infra/terraform/environments

jobs:
  plan:
    name: "Plan — ${{ matrix.env }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC — no key file)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive ../../
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="db_password=PLAN_ONLY_PLACEHOLDER" \
            -out=tfplan.${{ matrix.env }}
        continue-on-error: true

      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const output = `### Terraform Plan — \`${{ matrix.env }}\`

            | Step | Result |
            |---|---|
            | fmt | \`${process.env.FMT_OUTCOME}\` |
            | init | \`${process.env.INIT_OUTCOME}\` |
            | validate | \`${process.env.VALIDATE_OUTCOME}\` |
            | plan | \`${process.env.PLAN_OUTCOME}\` |

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>

            *Triggered by: @${{ github.actor }} on \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
